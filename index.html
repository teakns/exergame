<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹캠 테니스 (그랜드슬램 코트)</title>
<style>
  :root{
    --bg:#0e2433; --panel:#16384d; --ink:#eef4f7; --sub:#9db7c4;
    --ball:#d9f23b; --warn:#ffb347; --line:#2c5670;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:16px;
  }
  h1{font-size:1.25rem; margin:4px 0 12px; font-weight:700; letter-spacing:-0.01em}
  .stage{width:100%; max-width:960px; display:flex; justify-content:center}
  canvas{width:min(100%, calc(76vh * 4 / 3)); height:auto; display:block; border-radius:14px; background:#1f6f52; touch-action:none}
  .bar{
    width:100%; max-width:960px; margin-top:12px; padding:12px 14px;
    background:var(--panel); border-radius:12px;
    display:flex; flex-wrap:wrap; gap:12px 22px; align-items:center;
  }
  .row{display:flex; gap:8px; flex-wrap:wrap; width:100%; align-items:center}
  .grp{color:var(--sub); font-size:.92rem; margin-right:4px; min-width:5.2em}
  .mode, .chip{
    font:inherit; font-weight:700; color:var(--ink); background:transparent;
    border:2px solid var(--line); border-radius:10px; padding:8px 14px; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px;
  }
  .mode b{display:inline-block; min-width:1.4em; margin-right:4px; color:var(--ball)}
  .chip i{display:inline-block; width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,.55)}
  .mode[aria-pressed="true"], .chip[aria-pressed="true"]{background:#0e2433; border-color:var(--ball)}
  .mode:hover, .chip:hover{border-color:var(--sub)}
  #camBtn{
    font:inherit; font-weight:700; color:#10260a; background:var(--ball);
    border:0; border-radius:999px; padding:9px 18px; cursor:pointer;
  }
  #camBtn:disabled{opacity:.6; cursor:wait}
  button:focus-visible, input:focus-visible{outline:3px solid #fff; outline-offset:2px}
  label{display:flex; align-items:center; gap:8px; color:var(--sub); font-size:.92rem}
  #status{color:var(--sub); font-size:.92rem; flex:1 1 260px}
  #status.ok{color:var(--ball)}
  #status.err{color:var(--warn)}
  #modeDesc{
    width:100%; max-width:960px; margin:10px 0 0; color:var(--sub);
    font-size:.95rem; line-height:1.65;
  }
  #modeDesc b{color:var(--ink)}
  video{position:fixed; left:-9999px; width:320px; height:180px}
</style>
</head>
<body>
<h1>웹캠 테니스: 그랜드슬램 코트에서 손으로 받아치기</h1>

<div class="stage"><canvas id="c" aria-label="테니스 코트 화면"></canvas></div>

<div class="bar">
  <div class="row" role="group" aria-label="코트 선택">
    <span class="grp">코트 선택</span>
    <button class="chip" type="button" data-court="ao" aria-pressed="true"><i style="background:#3b9fd6"></i>호주 오픈</button>
    <button class="chip" type="button" data-court="fo" aria-pressed="false"><i style="background:#b5532f"></i>프랑스 오픈</button>
    <button class="chip" type="button" data-court="wim" aria-pressed="false"><i style="background:#5f9a2c"></i>윔블던</button>
    <button class="chip" type="button" data-court="us" aria-pressed="false"><i style="background:#2d4f8f"></i>US 오픈</button>
    <button class="chip" type="button" data-court="plain" aria-pressed="false"><i style="background:#4f8a2b"></i>일반 코트</button>
    <button class="chip" type="button" data-court="default" aria-pressed="false"><i style="background:#2f78bd"></i>기본(도형)</button>
  </div>
  <div class="row" id="viewRow" role="group" aria-label="코트 시점" style="display:none">
    <span class="grp">시점</span>
    <button class="chip" type="button" data-view="strong" aria-pressed="true">강한 원근</button>
    <button class="chip" type="button" data-view="mid" aria-pressed="false">중간 원근</button>
  </div>
  <div class="row" role="group" aria-label="방식 선택">
    <span class="grp">방식</span>
    <button class="mode" type="button" data-mode="A" aria-pressed="true"><b>A</b>손목으로 라켓 움직이기</button>
    <button class="mode" type="button" data-mode="B" aria-pressed="false"><b>B</b>구역에 손 대면 스윙</button>
  </div>
  <button id="camBtn" type="button">카메라 켜기</button>
  <label><input id="showPrev" type="checkbox" checked> 카메라 미리보기</label>
  <div id="status">카메라가 꺼져 있어요.</div>
</div>

<p id="modeDesc"></p>

<video id="v" playsinline muted></video>

/* ---------- 코트 기하 ---------- */
/* s: 코트 깊이. 0 = 내 쪽 베이스라인, 1 = 상대 쪽 베이스라인.
   각 코트는 yOf(s)(화면 y), xAt(s,u)(u=0 왼쪽 ~ 1 오른쪽), rOf(s)(공 크기)를 제공한다. */
const CX = W / 2;
const SV = 6.4 / 23.77;            // 네트에서 서비스 라인까지의 실제 비율
const ZONE_TOP = 0.35;             // B 방식: 카메라 화면 아래쪽 65%에서 구역 인식
const sOfT = t => lerp(0.97, 0.03, t);   // 공은 깊이 방향으로 일정한 속도로 움직임
const laneU = lane => (lane + 0.5) / 3;

/* 이미지 코트: 이미지 원본(1024px) 좌표로 잰 값을 캔버스 좌표로 변환 */
function makeImageGeom() {
  const k = W / 1024, IY = y => (y - 60) * k, IX = x => x * k;   // 이미지는 위쪽 60px을 잘라 4:3으로 사용
  const Y0 = IY(786.5), Yn = IY(465), Y1 = IY(212);               // 내 쪽 베이스라인, 네트 바닥, 상대 베이스라인
  const XL0 = IX(96), XR0 = IX(929.5), XL1 = IX(362.5), XR1 = IX(667.5);
  const D = 1 / ((Y0 - Yn) / (Yn - Y1) - 1);
  const A = (Y0 - Y1) / (1 / D - 1 / (D + 1));
  const yh = Y0 - A / D;
  const yOf = s => yh + A / (D + s);
  const frac = y => (y - Y1) / (Y0 - Y1);
  const xAt = (s, u) => { const f = frac(yOf(s)); return lerp(lerp(XL1, XL0, f), lerp(XR1, XR0, f), u); };
  const rOf = s => 7 + 11 * clamp(frac(yOf(s)), 0, 1.1);
  const zoneY = IY(720);
  return { vector: false, yOf, xAt, rOf, zoneS: A / (zoneY - yh) - D, zoneDY: 0, zoneRy: 45, zoneRxF: 0.84,
           racketTop: yOf(0.65), racketBot: Y0 - 15, pivotY: Y0 - 5, msgY: Y1 + 70 };
}

/* 도형 코트: 원근 투영으로 직접 그림 */
const GEO = {
  strong: { D: 0.6, A: 384, yh: -120, B: 240 },   // 윗변:아랫변 ≈ 0.38
  mid:    { D: 1.0, A: 800, yh: -280, B: 400 }    // 윗변:아랫변 = 0.50
};
function makeVectorGeom(key) {
  const P = GEO[key], DY = 100;
  const yOf = s => P.yh + DY + P.A / (P.D + s);
  const hwOf = s => P.B / (P.D + s);
  const xAt = (s, u) => CX + (u - 0.5) * 2 * hwOf(s);
  const rOf = s => 18 * (1 / (P.D + s)) / (1 / (P.D + 0.03));
  return { vector: true, yOf, hwOf, xAt, rOf, zoneS: 0.0652, zoneDY: 12, zoneRy: 34, zoneRxF: 0.88,
           racketTop: yOf(0.65), racketBot: yOf(0) - 15, pivotY: yOf(0) - 8, msgY: yOf(1) + 60 };
}

let courtKey = 'ao', view = 'strong', G = null;
const IMAGE_GEOM = makeImageGeom();
function applyCourt() { G = courtKey === 'default' ? makeVectorGeom(view) : IMAGE_GEOM; }
const ballY = t => G.yOf(sOfT(t));
const laneX = (t, u) => G.xAt(sOfT(t), u);
const ballR = t => G.rOf(sOfT(t));
const ballScreen = b => ({ x: laneX(b.t, b.u), y: ballY(b.t) - Math.sin(Math.PI * b.t) * 55 });

/* ---------- 상태 ---------- */
let mode = 'A';
let score = 0, streak = 0, best = 0;
let ball = null, serveTimer = 0.8, prevU = -1;
const swings = [0, 0, 0], lastTrig = [0, 0, 0], wasIn = [false, false, false];
let curZone = -1;
const effects = [];
let msg = { text: '', color: '#fff', t0: -9999 };
const racket = { x: W / 2, y: 520, px: W / 2, py: 520, speed: 0, vx: 0, active: false };
const trail = [];
const ptr = { x: W / 2, y: 520, on: false };
const hand = { present: false, x: 0.5, y: 0.5, vx: 0, vy: 0, sp: 0, t: 0, seen: 0, lm: null };

/* ---------- 소리 ---------- */
let ac;
function tone(f1, f2, dur, type, vol) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
    o.type = type;
    o.frequency.setValueAtTime(f1, n);
    o.frequency.exponentialRampToValueAtTime(f2, n + dur);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.001, n + dur);
    o.connect(g).connect(ac.destination);
    o.start(); o.stop(n + dur);
  } catch (e) {}
}

/* ---------- 선택 UI ---------- */
const DESC = {
  A: '<b>A. 손목으로 라켓 움직이기</b> 손바닥 가운데 점이 라켓의 중심이 돼요. 날아오는 공에 라켓을 갖다 대면 받아치고, <b>손을 빨리 움직일수록 공이 세게</b> 날아가요. 카메라가 없으면 마우스로 라켓을 움직여 볼 수 있어요.',
  B: '<b>B. 구역에 손 대면 스윙</b> 공이 가까워지면 해당 칸이 노랗게 빛나요. 그 칸 쪽(카메라 화면의 아래쪽 70%)에 <b>손바닥을 넣거나 칸 안에서 손을 빠르게 흔들면</b> 라켓이 알아서 스윙해요. 카메라가 없으면 키보드 1·2·3이나 화면 클릭으로 해 볼 수 있어요.'
};
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  $('modeDesc').innerHTML = DESC[m];
  ball = null; serveTimer = 0.8; prevU = -1;
  score = 0; streak = 0; best = 0; effects.length = 0; trail.length = 0;
  wasIn.fill(false);
}
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

function setCourt(key) {
  courtKey = key; applyCourt();
  document.querySelectorAll('.chip[data-court]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.court === key)));
  $('viewRow').style.display = key === 'default' ? 'flex' : 'none';
}
function setView(v) {
  view = v; applyCourt();
  document.querySelectorAll('.chip[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
}
document.querySelectorAll('.chip[data-court]').forEach(b => b.addEventListener('click', () => setCourt(b.dataset.court)));
document.querySelectorAll('.chip[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

/* ---------- 게임 로직 ---------- */
function serve() {
  let u, lane = -1;
  if (mode === 'B') {
    do { lane = Math.floor(Math.random() * 3); } while (laneU(lane) === prevU);
    u = laneU(lane);
  } else {
    do { u = 0.15 + Math.random() * 0.7; } while (Math.abs(u - prevU) < 0.2);
    lane = Math.min(2, Math.floor(u * 3));
  }
  prevU = u;
  ball = { u, lane, t: 0, dir: 1, speed: 0.42 + Math.min(score, 10) * 0.03, state: 'fly', timer: 0 };
}
function say(text, color) { msg = { text, color, t0: performance.now() }; }

function returnBall(now, speed, text, color) {
  ball.dir = -1; ball.speed = speed;
  const p = ballScreen(ball);
  effects.push({ x: p.x, y: p.y, t0: now });
  tone(200, 55, 0.16, 'square', 0.18);
  say(text, color);
}

/* B 방식: 구역 스윙 */
function triggerLane(lane, now) {
  if (mode !== 'B') return;
  if (now - lastTrig[lane] < 450) return;
  lastTrig[lane] = now; swings[lane] = now;
  tone(380, 140, 0.09, 'triangle', 0.12);
  if (ball && ball.state === 'fly' && ball.dir === 1 && ball.lane === lane && ball.t >= 0.6) {
    returnBall(now, 1.2, '굿샷!', '#d9f23b');
  }
}

/* A 방식: 라켓과 공의 충돌 */
function checkRacketHit(now) {
  if (mode !== 'A' || !racket.active) return;
  if (!ball || ball.state !== 'fly' || ball.dir !== 1 || ball.t < 0.55) return;
  const p = ballScreen(ball);
  if (Math.hypot(p.x - racket.x, p.y - racket.y) < 64) {
    const power = clamp(racket.speed / 1400, 0, 1);
    ball.u = clamp(ball.u + racket.vx / 6000, 0.1, 0.9);
    tone(380, 140, 0.09, 'triangle', 0.12);
    returnBall(now, 0.8 + power * 1.1, power > 0.6 ? `강한 샷! 세기 ${Math.round(power * 100)}` : `굿샷! 세기 ${Math.round(power * 100)}`,
               power > 0.6 ? '#ffb347' : '#d9f23b');
  }
}

function update(dt, now) {
  /* 라켓 위치(A 방식) */
  let tx = racket.x, ty = racket.y, active = false;
  if (camOn) {
    if (hand.present) {
      tx = lerp(50, W - 50, clamp((hand.x - 0.1) / 0.8, 0, 1));
      ty = lerp(G.racketTop, G.racketBot, clamp((hand.y - 0.2) / 0.65, 0, 1));
      active = true;
    }
  } else if (ptr.on) { tx = ptr.x; ty = ptr.y; active = true; }
  racket.active = active;
  const k = Math.min(1, dt * 30);
  racket.x = lerp(racket.x, tx, k); racket.y = lerp(racket.y, ty, k);
  if (dt > 0) {
    racket.speed = lerp(racket.speed, Math.hypot(racket.x - racket.px, racket.y - racket.py) / dt, 0.35);
    racket.vx = lerp(racket.vx, (racket.x - racket.px) / dt, 0.35);
  }
  racket.px = racket.x; racket.py = racket.y;
  if (mode === 'A' && active) {
    trail.push({ x: racket.x, y: racket.y });
    if (trail.length > 9) trail.shift();
  } else if (trail.length) trail.shift();

  /* 공 */
  if (!ball) {
    serveTimer -= dt;
    if (serveTimer <= 0) serve();
    return;
  }
  if (ball.state === 'fly') {
    ball.t += ball.dir * ball.speed * dt;
    checkRacketHit(now);
    if (ball.dir === 1 && ball.t >= 1) {
      ball.t = 1; ball.state = 'miss'; ball.timer = 0;
      streak = 0; say('아쉬워요!', '#ffb347');
      tone(160, 70, 0.25, 'sawtooth', 0.08);
    } else if (ball.dir === -1 && ball.t <= 0.02) {
      score++; streak++; best = Math.max(best, streak);
      ball = null; serveTimer = 0.7;
    }
  } else if (ball.state === 'miss') {
    ball.timer += dt;
    if (ball.timer > 0.8) { ball = null; serveTimer = 0.5; }
  }
}

/* ---------- 손 인식 결과 처리 ---------- */
function onHand(res, now) {
  const lm = res.landmarks && res.landmarks[0];
  if (!lm) {
    if (now - hand.seen > 300) { hand.present = false; hand.lm = null; hand.sp = 0; }
    return;
  }
  let sx = 0, sy = 0;
  for (const i of [0, 5, 9, 13, 17]) { sx += lm[i].x; sy += lm[i].y; }
  const x = 1 - sx / 5, y = sy / 5;          // 거울처럼 좌우 반전한 손바닥 중심
  const dt = Math.max(0.001, (now - hand.t) / 1000);
  if (!hand.present) { hand.x = x; hand.y = y; hand.vx = 0; hand.vy = 0; hand.sp = 0; }
  else {
    const nx = lerp(hand.x, x, 0.55), ny = lerp(hand.y, y, 0.55);
    hand.vx = (nx - hand.x) / dt; hand.vy = (ny - hand.y) / dt;
    hand.x = nx; hand.y = ny;
    hand.sp = lerp(hand.sp, Math.hypot(hand.vx, hand.vy), 0.5);
  }
  hand.present = true; hand.seen = now; hand.t = now; hand.lm = lm;
}

function checkZoneB(now) {
  curZone = (mode === 'B' && camOn && hand.present && hand.y >= ZONE_TOP)
    ? Math.min(2, Math.floor(hand.x * 3)) : -1;
  for (let l = 0; l < 3; l++) {
    const inside = l === curZone;
    if (inside && (!wasIn[l] || hand.sp > 0.7)) triggerLane(l, now);
    wasIn[l] = inside;
  }
}

/* ---------- 카메라, 모델 ---------- */
let camOn = false, stream = null, landmarker = null, lastVT = -1;
function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ''; }

async function loadModel() {
  if (landmarker) return;
  setStatus('손 인식 모델을 불러오는 중이에요. 처음에는 몇 초 걸려요…', '');
  const mod = await import(`${MP_BASE}/vision_bundle.mjs`);
  const files = await mod.FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
  const make = delegate => mod.HandLandmarker.createFromOptions(files, {
    baseOptions: { modelAssetPath: MODEL_URL, delegate },
    runningMode: 'VIDEO', numHands: 1,
    minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5
  });
  try { landmarker = await make('GPU'); } catch (e) { landmarker = await make('CPU'); }
}

async function startCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus('이 주소에서는 카메라를 쓸 수 없어요. https 주소(예: GitHub Pages)로 열거나, 카메라가 있는 컴퓨터에서 파일을 직접 열어 주세요.', 'err');
    return;
  }
  camBtn.disabled = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 360, facingMode: 'user' }, audio: false });
    video.srcObject = stream; await video.play();
  } catch (e) {
    camBtn.disabled = false;
    const name = e && e.name;
    if (name === 'NotAllowedError') setStatus('카메라 권한이 막혀 있어요. 주소창 옆 자물쇠 아이콘에서 카메라를 "허용"으로 바꾸고 새로고침해 주세요.', 'err');
    else if (name === 'NotFoundError') setStatus('연결된 카메라를 찾을 수 없어요.', 'err');
    else setStatus('카메라를 켤 수 없어요. 다른 프로그램이 카메라를 쓰고 있는지 확인해 주세요.', 'err');
    return;
  }
  try {
    await loadModel();
  } catch (e) {
    console.error(e);
    stream.getTracks().forEach(t => t.stop());
    camBtn.disabled = false;
    setStatus('손 인식 모델을 불러오지 못했어요. 인터넷 연결을 확인하고, 학교 네트워크라면 cdn.jsdelivr.net과 storage.googleapis.com이 막혀 있지 않은지 확인해 주세요.', 'err');
    return;
  }
  camOn = true; camBtn.disabled = false; camBtn.textContent = '카메라 끄기';
  hand.present = false; lastVT = -1;
  setStatus('준비됐어요. 손바닥을 카메라에 보여 주세요.', 'ok');
}
function stopCam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  camOn = false; hand.present = false; hand.lm = null; curZone = -1;
  camBtn.textContent = '카메라 켜기';
  setStatus('카메라가 꺼져 있어요.', '');
}
camBtn.addEventListener('click', () => { camOn ? stopCam() : startCam(); });

/* ---------- 입력(키보드, 마우스) ---------- */
const keyMap = { '1': 0, '2': 1, '3': 2, a: 0, s: 1, d: 2 };
addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'v' && courtKey === 'default') { setView(view === 'strong' ? 'mid' : 'strong'); return; }
  const l = keyMap[e.key.toLowerCase()];
  if (l !== undefined) triggerLane(l, performance.now());
});
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointermove', e => { const p = toCanvas(e); ptr.x = p.x; ptr.y = p.y; ptr.on = true; });
cv.addEventListener('pointerdown', e => {
  const p = toCanvas(e); ptr.x = p.x; ptr.y = p.y; ptr.on = true;
  if (mode === 'B' && p.y > G.yOf(0.6)) triggerLane(p.x < W / 3 ? 0 : p.x < 2 * W / 3 ? 1 : 2, performance.now());
});

/* ---------- 그리기 ---------- */
function drawVectorCourt() {
  const { xAt, yOf, hwOf } = G;
  ctx.fillStyle = '#1f6f52'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,.25)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.beginPath();
  ctx.moveTo(xAt(1, 0), yOf(1)); ctx.lineTo(xAt(1, 1), yOf(1));
  ctx.lineTo(xAt(0, 1), yOf(0)); ctx.lineTo(xAt(0, 0), yOf(0)); ctx.closePath();
  ctx.fillStyle = '#2f78bd'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#f4f7f2'; ctx.stroke();

  const hl = s => { ctx.beginPath(); ctx.moveTo(xAt(s, 0), yOf(s)); ctx.lineTo(xAt(s, 1), yOf(s)); ctx.stroke(); };
  ctx.lineWidth = 2.5; hl(0.5 - SV); hl(0.5 + SV);
  ctx.beginPath(); ctx.moveTo(CX, yOf(0.5 - SV)); ctx.lineTo(CX, yOf(0.5 + SV)); ctx.stroke();

  const ny = yOf(0.5), hw = hwOf(0.5) * 1.07, nh = hwOf(0.5) * 0.17;
  ctx.fillStyle = 'rgba(244,247,242,.22)';
  ctx.fillRect(CX - hw, ny - nh, hw * 2, nh);
  ctx.strokeStyle = 'rgba(244,247,242,.5)'; ctx.lineWidth = 1;
  for (let x = CX - hw; x <= CX + hw; x += 10) { ctx.beginPath(); ctx.moveTo(x, ny - nh); ctx.lineTo(x, ny); ctx.stroke(); }
  for (let y = ny - nh; y <= ny; y += 9) { ctx.beginPath(); ctx.moveTo(CX - hw, y); ctx.lineTo(CX + hw, y); ctx.stroke(); }
  ctx.lineWidth = 3; ctx.strokeStyle = '#f4f7f2';
  ctx.beginPath(); ctx.moveTo(CX - hw, ny - nh); ctx.lineTo(CX + hw, ny - nh); ctx.stroke();
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(CX - hw, ny - nh); ctx.lineTo(CX - hw, ny); ctx.moveTo(CX + hw, ny - nh); ctx.lineTo(CX + hw, ny); ctx.stroke();
}

function drawCourt() {
  if (G.vector) { drawVectorCourt(); return; }
  const img = COURTS[courtKey].el;
  if (img && img.complete && img.naturalWidth) ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, W, H);
  else { ctx.fillStyle = '#2a4a3a'; ctx.fillRect(0, 0, W, H); }
}

function drawZones(now) {
  const names = ['왼쪽', '가운데', '오른쪽'];
  const zs = G.zoneS, y = G.yOf(zs) + G.zoneDY;
  const rx = (G.xAt(zs, 1) - G.xAt(zs, 0)) / 6 * G.zoneRxF, ry = G.zoneRy;
  for (let l = 0; l < 3; l++) {
    const x = G.xAt(zs, laneU(l));
    const hot = ball && ball.state === 'fly' && ball.dir === 1 && ball.lane === l && ball.t >= 0.6;
    const touched = curZone === l;
    const pulse = 0.5 + 0.5 * Math.sin(now / 90);
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = hot ? `rgba(217,242,59,${0.28 + 0.25 * pulse})`
                  : touched ? 'rgba(255,255,255,.28)' : 'rgba(255,255,255,.08)';
    ctx.fill();
    if (hot) { ctx.setLineDash([]); ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.stroke(); }
    ctx.setLineDash(hot || touched ? [] : [8, 7]);
    ctx.lineWidth = hot ? 4 : 2;
    ctx.strokeStyle = hot ? '#d9f23b' : 'rgba(255,255,255,.7)';
    ctx.stroke(); ctx.setLineDash([]);
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 4;
    ctx.fillStyle = hot ? '#f3ffa0' : 'rgba(255,255,255,.9)';
    ctx.font = '700 18px "Pretendard","Malgun Gothic",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(names[l], x, y + 6);
    ctx.restore();
  }
}

function drawLanding(now) {
  if (!ball || ball.state !== 'fly' || ball.dir !== 1 || ball.t < 0.3) return;
  const x = laneX(1, ball.u), y = ballY(1);
  const pulse = 0.5 + 0.5 * Math.sin(now / 110);
  ctx.setLineDash([6, 6]);
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(x, y + 4, 46, 16, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 3; ctx.strokeStyle = `rgba(217,242,59,${0.45 + 0.4 * pulse})`;
  ctx.beginPath(); ctx.ellipse(x, y + 4, 46, 16, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
}

function drawBall() {
  if (!ball) return;
  const t = ball.t, x = laneX(t, ball.u), yb = ballY(t);
  const r = ballR(t), arc = Math.sin(Math.PI * t) * 55;
  const alpha = ball.state === 'miss' ? Math.max(0, 1 - ball.timer / 0.8) : 1;
  const drop = ball.state === 'miss' ? ball.timer * 40 : 0;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(x, yb + r * 0.9, r * 1.1, r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d9f23b';
  ctx.beginPath(); ctx.arc(x, yb - arc + drop, r, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = Math.max(1, r * 0.1); ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = Math.max(1, r * 0.14);
  ctx.beginPath(); ctx.arc(x - r * 0.9, yb - arc + drop, r * 0.95, -0.7, 0.7); ctx.stroke();
  ctx.beginPath(); ctx.arc(x + r * 0.9, yb - arc + drop, r * 0.95, Math.PI - 0.7, Math.PI + 0.7); ctx.stroke();
  ctx.globalAlpha = 1;
}

/* 라켓 모양: 머리 중심이 원점 */
function racketBody() {
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(0, 98); ctx.lineTo(0, 56); ctx.stroke();
  ctx.strokeStyle = '#e8eef0'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, 56); ctx.lineTo(-11, 32); ctx.moveTo(0, 56); ctx.lineTo(11, 32); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 0, 29, 40, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1;
  for (let k = -3; k <= 3; k++) {
    ctx.beginPath(); ctx.moveTo(k * 9, -42); ctx.lineTo(k * 9, 42); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-30, k * 12); ctx.lineTo(30, k * 12); ctx.stroke();
  }
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(0, 0, 29, 40, 0, 0, Math.PI * 2);
  ctx.strokeStyle = '#f2f5f0'; ctx.lineWidth = 6; ctx.stroke();
}

function drawRacketA() {
  for (let i = 0; i < trail.length; i++) {
    const a = (i + 1) / trail.length;
    ctx.fillStyle = `rgba(217,242,59,${0.2 * a})`;
    ctx.beginPath(); ctx.ellipse(trail[i].x, trail[i].y, 29 * a, 40 * a, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.save();
  ctx.globalAlpha = racket.active ? 1 : 0.3;
  ctx.translate(racket.x, racket.y);
  ctx.rotate(clamp(racket.vx / 3000, -0.5, 0.5) + (racket.x - W / 2) / W * 0.4);
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 6;
  racketBody();
  ctx.restore();
}

function drawRacketsB(now) {
  for (let l = 0; l < 3; l++) {
    const p = (now - swings[l]) / 280;
    if (p < 0 || p >= 1) continue;
    const dir = l === 2 ? -1 : 1;
    const a = lerp(-1.15 * dir, 1.15 * dir, 1 - Math.pow(1 - p, 3));
    ctx.save();
    ctx.translate(laneX(0.97, laneU(l)), G.pivotY); ctx.rotate(a); ctx.translate(0, -98);
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 6;
    racketBody();
    ctx.restore();
  }
}

function drawEffects(now) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const age = (now - effects[i].t0) / 1000;
    if (age > 0.5) { effects.splice(i, 1); continue; }
    ctx.strokeStyle = `rgba(217,242,59,${1 - age / 0.5})`;
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(effects[i].x, effects[i].y, 12 + age * 170, 0, Math.PI * 2); ctx.stroke();
  }
}

function drawPreview() {
  const pw = 220, ph = 124, px = W - pw - 14, py = 14;
  ctx.fillStyle = 'rgba(8,20,30,.78)';
  ctx.fillRect(px - 6, py - 6, pw + 12, ph + 12);
  if (camOn && video.readyState >= 2) {
    ctx.save(); ctx.translate(px + pw, py); ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, pw, ph); ctx.restore();
  } else {
    ctx.fillStyle = '#9db7c4'; ctx.font = '14px "Malgun Gothic",system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('카메라 꺼짐', px + pw / 2, py + ph / 2 + 5);
  }
  if (mode === 'B') {
    for (let l = 0; l < 3; l++) {
      const zx = px + l * pw / 3, zy = py + ph * ZONE_TOP, zw = pw / 3, zh = ph * (1 - ZONE_TOP);
      if (curZone === l) { ctx.fillStyle = 'rgba(217,242,59,.35)'; ctx.fillRect(zx, zy, zw, zh); }
      ctx.strokeStyle = curZone === l ? '#d9f23b' : 'rgba(255,255,255,.6)';
      ctx.lineWidth = curZone === l ? 3 : 1.5;
      ctx.strokeRect(zx, zy, zw, zh);
    }
  } else {
    ctx.setLineDash([5, 4]); ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(px + pw * 0.1, py + ph * 0.2, pw * 0.8, ph * 0.65);
    ctx.setLineDash([]);
  }
  if (camOn && hand.present && hand.lm) {
    const P = i => [px + (1 - hand.lm[i].x) * pw, py + hand.lm[i].y * ph];
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.5;
    for (const [a, b] of HAND_LINES) {
      const A = P(a), B = P(b);
      ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
    }
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 21; i++) { const A = P(i); ctx.beginPath(); ctx.arc(A[0], A[1], 2, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#d9f23b';
    ctx.beginPath(); ctx.arc(px + hand.x * pw, py + hand.y * ph, 6, 0, Math.PI * 2); ctx.fill();
  }
}

function drawHUD(now) {
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(8,20,30,.78)';
  ctx.fillRect(14, 14, 200, 96);
  ctx.fillStyle = '#9db7c4'; ctx.font = '15px "Malgun Gothic",system-ui,sans-serif';
  ctx.fillText('점수', 28, 38);
  ctx.fillStyle = '#eef4f7'; ctx.font = '800 44px "Malgun Gothic",system-ui,sans-serif';
  ctx.fillText(String(score), 28, 84);
  ctx.fillStyle = '#9db7c4'; ctx.font = '15px "Malgun Gothic",system-ui,sans-serif';
  ctx.fillText('연속 ' + streak, 112, 58);
  ctx.fillText('최고 ' + best, 112, 84);

  if (camOn && !hand.present) {
    ctx.save();
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffb347';
    ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 6;
    ctx.font = '700 22px "Malgun Gothic",system-ui,sans-serif';
    ctx.fillText('손바닥을 카메라에 보여 주세요', W / 2, H * 0.5);
    ctx.restore();
  }

  const age = (now - msg.t0) / 1000;
  if (age < 0.9) {
    ctx.save();
    ctx.globalAlpha = 1 - age / 0.9;
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 8;
    ctx.fillStyle = msg.color;
    ctx.font = '800 44px "Malgun Gothic",system-ui,sans-serif';
    ctx.fillText(msg.text, W / 2, G.msgY - age * 24);
    ctx.restore();
  }
}

function draw(now) {
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  drawCourt();
  if (mode === 'B') drawZones(now); else drawLanding(now);
  drawBall();
  if (mode === 'A') drawRacketA(); else drawRacketsB(now);
  drawEffects(now);
  if (showPrev.checked) drawPreview();
  drawHUD(now);
}

/* ---------- 메인 루프 ---------- */
let last = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (camOn && landmarker && video.readyState >= 2 && video.currentTime !== lastVT) {
    lastVT = video.currentTime;
    try { onHand(landmarker.detectForVideo(video, now), now); } catch (e) { console.error(e); }
    checkZoneB(now);
  }
  update(dt, now); draw(now);
  requestAnimationFrame(frame);
}
applyCourt();
setMode('A');
requestAnimationFrame(frame);
</script>
</body>
</html>

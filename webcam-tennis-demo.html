<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹캠 테니스 데모</title>
<style>
  :root{
    --bg:#0e2433; --panel:#16384d; --ink:#eef4f7; --sub:#9db7c4;
    --ball:#d9f23b; --warn:#ffb347; --line:#2c5670;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:16px;
  }
  h1{font-size:1.25rem; margin:4px 0 12px; font-weight:700; letter-spacing:-0.01em}
  .stage{width:100%; max-width:960px}
  canvas{width:100%; height:auto; display:block; border-radius:14px; background:#1f6f52; cursor:pointer; touch-action:manipulation}
  .bar{
    width:100%; max-width:960px; margin-top:12px; padding:12px 14px;
    background:var(--panel); border-radius:12px;
    display:flex; flex-wrap:wrap; gap:14px 22px; align-items:center;
  }
  button{
    font:inherit; font-weight:700; color:#10260a; background:var(--ball);
    border:0; border-radius:999px; padding:9px 18px; cursor:pointer;
  }
  button:hover{filter:brightness(1.06)}
  button:focus-visible, input:focus-visible{outline:3px solid #fff; outline-offset:2px}
  label{display:flex; align-items:center; gap:8px; color:var(--sub); font-size:.92rem}
  input[type=range]{accent-color:var(--ball); width:150px}
  #status{color:var(--sub); font-size:.92rem; flex:1 1 220px}
  #status.ok{color:var(--ball)}
  #status.err{color:var(--warn)}
  .help{
    width:100%; max-width:960px; margin-top:10px; color:var(--sub);
    font-size:.92rem; line-height:1.65;
  }
  .help b{color:var(--ink)}
  video{position:fixed; left:-9999px; width:320px; height:180px}
</style>
</head>
<body>
<h1>웹캠 테니스: 손을 휘둘러 공을 받아치세요</h1>

<div class="stage"><canvas id="c" aria-label="테니스 코트 화면"></canvas></div>

<div class="bar">
  <button id="camBtn" type="button">카메라 켜기</button>
  <label>민감도 <input id="sens" type="range" min="1" max="10" value="5"><span id="sensVal">5</span></label>
  <label><input id="showPrev" type="checkbox" checked> 카메라 미리보기</label>
  <div id="status">카메라가 꺼져 있어요. 키보드 1·2·3 또는 화면 클릭으로 먼저 해 볼 수 있어요.</div>
</div>

<div class="help">
  <b>하는 방법</b> 공이 가까이 오면 해당 칸이 노랗게 빛나요. 그때 <b>그 칸에 해당하는 위치에서 손을 크게 휘저으면</b> 라켓이 공을 쳐 냅니다.
  오른쪽 위 미리보기에서 화면을 좌·중·우 세 칸으로 나눠 놓았고, 아래쪽 70% 영역에서 움직임을 읽어요.
  카메라는 이 컴퓨터 안에서만 쓰이고 어디로도 전송되지 않아요.
</div>

<video id="v" playsinline muted></video>

<script>
(() => {
  const W = 960, H = 540;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  cv.width = W * 2; cv.height = H * 2;

  const $ = id => document.getElementById(id);
  const video = $('v'), camBtn = $('camBtn'), statusEl = $('status');
  const sens = $('sens'), sensVal = $('sensVal'), showPrev = $('showPrev');

  const lerp = (a, b, t) => a + (b - a) * t;

  /* ---------- 코트 기하 ---------- */
  const C = { top: 120, bot: 520, topL: 330, topR: 630, botL: 80, botR: 880 };
  const edgeL = y => lerp(C.topL, C.botL, (y - C.top) / (C.bot - C.top));
  const edgeR = y => lerp(C.topR, C.botR, (y - C.top) / (C.bot - C.top));
  const ballY = t => 135 + t * 355;
  const laneX = (t, lane) => {
    const y = ballY(t), l = edgeL(y), r = edgeR(y);
    return l + (r - l) * (lane + 0.5) / 3;
  };
  const ZONE_T = 0.92;

  /* ---------- 소리 ---------- */
  let ac;
  function tone(f1, f2, dur, type, vol) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
      o.type = type;
      o.frequency.setValueAtTime(f1, n);
      o.frequency.exponentialRampToValueAtTime(f2, n + dur);
      g.gain.setValueAtTime(vol, n);
      g.gain.exponentialRampToValueAtTime(0.001, n + dur);
      o.connect(g).connect(ac.destination);
      o.start(); o.stop(n + dur);
    } catch (e) {}
  }

  /* ---------- 게임 상태 ---------- */
  let score = 0, streak = 0, best = 0;
  let ball = null, serveTimer = 0.8, prevLane = -1;
  const swings = [0, 0, 0];       // 스윙 시작 시각
  const lastTrig = [0, 0, 0];
  const effects = [];
  let msg = { text: '', color: '#fff', t0: -9999 };

  function serve() {
    let lane;
    do { lane = Math.floor(Math.random() * 3); } while (lane === prevLane);
    prevLane = lane;
    ball = { lane, t: 0, dir: 1, speed: 0.42 + Math.min(score, 10) * 0.03, state: 'fly', timer: 0 };
  }

  function say(text, color) { msg = { text, color, t0: performance.now() }; }

  function triggerLane(lane, now) {
    if (now - lastTrig[lane] < 450) return;
    lastTrig[lane] = now;
    swings[lane] = now;
    tone(380, 140, 0.09, 'triangle', 0.12);
    if (ball && ball.state === 'fly' && ball.dir === 1 && ball.lane === lane && ball.t >= 0.6) {
      ball.dir = -1; ball.speed = 1.2;
      effects.push({ x: laneX(ball.t, lane), y: ballY(ball.t), t0: now });
      tone(200, 55, 0.16, 'square', 0.18);
      say('굿샷!', '#d9f23b');
    }
  }

  /* ---------- 카메라 모션 감지 ---------- */
  const mw = 80, mh = 45;
  const mc = document.createElement('canvas'); mc.width = mw; mc.height = mh;
  const mx = mc.getContext('2d', { willReadFrequently: true });
  let prev = null, camOn = false, stream = null, lastSample = 0;
  const motion = [0, 0, 0];
  const thr = () => 0.10 - 0.009 * Number(sens.value);
  const ZONE_TOP = 0.3;

  function sample() {
    if (!camOn || video.readyState < 2) return;
    mx.save(); mx.translate(mw, 0); mx.scale(-1, 1);
    mx.drawImage(video, 0, 0, mw, mh); mx.restore();
    const d = mx.getImageData(0, 0, mw, mh).data;
    const g = new Uint8Array(mw * mh);
    for (let i = 0; i < g.length; i++) g[i] = (d[i*4]*77 + d[i*4+1]*151 + d[i*4+2]*28) >> 8;
    if (prev) {
      const cnt = [0, 0, 0], y0 = Math.floor(mh * ZONE_TOP), lw = mw / 3;
      for (let y = y0; y < mh; y++) {
        for (let x = 0; x < mw; x++) {
          const i = y * mw + x;
          if (Math.abs(g[i] - prev[i]) > 28) cnt[Math.min(2, Math.floor(x / lw))]++;
        }
      }
      const area = lw * (mh - y0);
      for (let l = 0; l < 3; l++) motion[l] = motion[l] * 0.4 + (cnt[l] / area) * 0.6;
    }
    prev = g;
  }

  async function startCam() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 360, facingMode: 'user' }, audio: false });
      video.srcObject = stream; await video.play();
      camOn = true; prev = null;
      camBtn.textContent = '카메라 끄기';
      statusEl.className = 'ok';
      statusEl.textContent = '카메라가 켜졌어요. 빛나는 칸 쪽에서 손을 크게 휘저어 보세요.';
    } catch (e) {
      statusEl.className = 'err';
      statusEl.textContent = '카메라를 켤 수 없어요. 브라우저의 카메라 권한을 허용했는지 확인해 주세요. 키보드 1·2·3으로도 체험할 수 있어요.';
    }
  }
  function stopCam() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    camOn = false; prev = null; motion.fill(0);
    camBtn.textContent = '카메라 켜기';
    statusEl.className = '';
    statusEl.textContent = '카메라가 꺼져 있어요. 키보드 1·2·3 또는 화면 클릭으로 해 볼 수 있어요.';
  }
  camBtn.addEventListener('click', () => { tone(1, 1, 0.01, 'sine', 0.0001); camOn ? stopCam() : startCam(); });
  sens.addEventListener('input', () => sensVal.textContent = sens.value);

  /* ---------- 입력(키보드, 클릭) ---------- */
  const keyMap = { '1': 0, '2': 1, '3': 2, a: 0, s: 1, d: 2 };
  addEventListener('keydown', e => {
    const l = keyMap[e.key.toLowerCase()];
    if (l !== undefined) triggerLane(l, performance.now());
  });
  cv.addEventListener('pointerdown', e => {
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
    if (y > 250) triggerLane(x < W / 3 ? 0 : x < 2 * W / 3 ? 1 : 2, performance.now());
  });

  /* ---------- 업데이트 ---------- */
  function update(dt, now) {
    if (!ball) {
      serveTimer -= dt;
      if (serveTimer <= 0) serve();
      return;
    }
    if (ball.state === 'fly') {
      ball.t += ball.dir * ball.speed * dt;
      if (ball.dir === 1 && ball.t >= 1) {
        ball.t = 1; ball.state = 'miss'; ball.timer = 0;
        streak = 0; say('아쉬워요!', '#ffb347');
        tone(160, 70, 0.25, 'sawtooth', 0.08);
      } else if (ball.dir === -1 && ball.t <= 0.02) {
        score++; streak++; best = Math.max(best, streak);
        ball = null; serveTimer = 0.7;
      }
    } else if (ball.state === 'miss') {
      ball.timer += dt;
      if (ball.timer > 0.8) { ball = null; serveTimer = 0.5; }
    }
  }

  function checkMotion(now) {
    if (!camOn) return;
    for (let l = 0; l < 3; l++) if (motion[l] > thr()) triggerLane(l, now);
  }

  /* ---------- 그리기 ---------- */
  function drawCourt() {
    ctx.fillStyle = '#1f6f52'; ctx.fillRect(0, 0, W, H);
    // 바깥 여백의 은은한 명암
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(0,0,0,.25)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // 코트 바닥
    ctx.beginPath();
    ctx.moveTo(C.topL, C.top); ctx.lineTo(C.topR, C.top);
    ctx.lineTo(C.botR, C.bot); ctx.lineTo(C.botL, C.bot); ctx.closePath();
    ctx.fillStyle = '#2f78bd'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#f4f7f2'; ctx.stroke();

    // 서비스 라인, 센터 라인
    const hl = y => { ctx.beginPath(); ctx.moveTo(edgeL(y), y); ctx.lineTo(edgeR(y), y); ctx.stroke(); };
    ctx.lineWidth = 2.5; hl(215); hl(400);
    ctx.beginPath();
    ctx.moveTo((edgeL(215) + edgeR(215)) / 2, 215);
    ctx.lineTo((edgeL(400) + edgeR(400)) / 2, 400); ctx.stroke();

    // 네트
    const ny = 292;
    ctx.fillStyle = 'rgba(244,247,242,.28)';
    ctx.fillRect(edgeL(ny) - 14, ny - 16, edgeR(ny) - edgeL(ny) + 28, 16);
    ctx.strokeStyle = 'rgba(244,247,242,.55)'; ctx.lineWidth = 1;
    for (let x = edgeL(ny) - 14; x < edgeR(ny) + 14; x += 12) {
      ctx.beginPath(); ctx.moveTo(x, ny - 16); ctx.lineTo(x, ny); ctx.stroke();
    }
    ctx.lineWidth = 3; ctx.strokeStyle = '#f4f7f2';
    ctx.beginPath(); ctx.moveTo(edgeL(ny) - 14, ny - 16); ctx.lineTo(edgeR(ny) + 14, ny - 16); ctx.stroke();
  }

  function drawZones(now) {
    const names = ['왼쪽', '가운데', '오른쪽'];
    for (let l = 0; l < 3; l++) {
      const x = laneX(ZONE_T, l), y = ballY(ZONE_T) + 12;
      const y2 = ballY(ZONE_T), rx = (edgeR(y2) - edgeL(y2)) / 6 * 0.88;
      const hot = ball && ball.state === 'fly' && ball.dir === 1 && ball.lane === l && ball.t >= 0.6;
      const pulse = 0.5 + 0.5 * Math.sin(now / 90);
      ctx.beginPath(); ctx.ellipse(x, y, rx, 34, 0, 0, Math.PI * 2);
      ctx.fillStyle = hot ? `rgba(217,242,59,${0.28 + 0.25 * pulse})` : 'rgba(255,255,255,.08)';
      ctx.fill();
      ctx.setLineDash(hot ? [] : [8, 7]);
      ctx.lineWidth = hot ? 4 : 2;
      ctx.strokeStyle = hot ? '#d9f23b' : 'rgba(255,255,255,.5)';
      ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = hot ? '#10260a' : 'rgba(255,255,255,.75)';
      ctx.font = '700 17px "Pretendard","Malgun Gothic",system-ui,sans-serif';
      ctx.textAlign = 'center';
      if (hot) {
        ctx.fillStyle = '#eaff7a';
      }
      ctx.fillText(names[l], x, y + 6);
    }
  }

  function drawBall(now) {
    if (!ball) return;
    const t = ball.t, x = laneX(t, ball.lane), yb = ballY(t);
    const r = 5 + 13 * t, arc = Math.sin(Math.PI * t) * 55;
    const alpha = ball.state === 'miss' ? Math.max(0, 1 - ball.timer / 0.8) : 1;
    const drop = ball.state === 'miss' ? ball.timer * 40 : 0;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(x, yb + r * 0.9, r * 1.1, r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d9f23b';
    ctx.beginPath(); ctx.arc(x, yb - arc + drop, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = Math.max(1, r * 0.14);
    ctx.beginPath(); ctx.arc(x - r * 0.9, yb - arc + drop, r * 0.95, -0.7, 0.7); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + r * 0.9, yb - arc + drop, r * 0.95, Math.PI - 0.7, Math.PI + 0.7); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawRacket(x, y, p, dir) {
    const e = 1 - Math.pow(1 - p, 3);
    const a = lerp(-1.15 * dir, 1.15 * dir, e);
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -42); ctx.stroke();
    ctx.strokeStyle = '#e8eef0'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, -42); ctx.lineTo(-11, -66); ctx.moveTo(0, -42); ctx.lineTo(11, -66); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, -98, 29, 40, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1;
    for (let k = -3; k <= 3; k++) {
      ctx.beginPath(); ctx.moveTo(k * 9, -140); ctx.lineTo(k * 9, -56); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-30, -98 + k * 12); ctx.lineTo(30, -98 + k * 12); ctx.stroke();
    }
    ctx.restore();
    ctx.beginPath(); ctx.ellipse(0, -98, 29, 40, 0, 0, Math.PI * 2);
    ctx.strokeStyle = '#f2f5f0'; ctx.lineWidth = 6; ctx.stroke();
    ctx.restore();
  }

  function drawRackets(now) {
    for (let l = 0; l < 3; l++) {
      const p = (now - swings[l]) / 280;
      if (p >= 0 || p < 1) {
        if (p >= 0 && p < 1) drawRacket(laneX(0.97, l), 512, p, l === 2 ? -1 : 1);
      }
    }
  }

  function drawEffects(now) {
    for (let i = effects.length - 1; i >= 0; i--) {
      const age = (now - effects[i].t0) / 1000;
      if (age > 0.5) { effects.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(217,242,59,${1 - age / 0.5})`;
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(effects[i].x, effects[i].y - 30, 12 + age * 170, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function drawPreview() {
    const pw = 240, ph = 135, px = W - pw - 14, py = 14;
    ctx.fillStyle = 'rgba(8,20,30,.78)';
    ctx.fillRect(px - 6, py - 6, pw + 12, ph + 12);
    if (camOn && video.readyState >= 2) {
      ctx.save(); ctx.translate(px + pw, py); ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, pw, ph); ctx.restore();
    } else {
      ctx.fillStyle = '#9db7c4'; ctx.font = '14px "Malgun Gothic",system-ui,sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('카메라 꺼짐', px + pw / 2, py + ph / 2 + 5);
    }
    const t = thr();
    for (let l = 0; l < 3; l++) {
      const zx = px + l * pw / 3, zy = py + ph * ZONE_TOP, zw = pw / 3, zh = ph * (1 - ZONE_TOP);
      const level = Math.min(1, motion[l] / t);
      ctx.fillStyle = `rgba(217,242,59,${0.5 * level})`;
      ctx.fillRect(zx, zy, zw, zh);
      ctx.strokeStyle = level >= 1 ? '#d9f23b' : 'rgba(255,255,255,.6)';
      ctx.lineWidth = level >= 1 ? 3 : 1.5;
      ctx.strokeRect(zx, zy, zw, zh);
    }
  }

  function drawHUD(now) {
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(8,20,30,.78)';
    ctx.fillRect(14, 14, 200, 96);
    ctx.fillStyle = '#9db7c4'; ctx.font = '15px "Malgun Gothic",system-ui,sans-serif';
    ctx.fillText('점수', 28, 38);
    ctx.fillStyle = '#eef4f7'; ctx.font = '800 44px "Malgun Gothic",system-ui,sans-serif';
    ctx.fillText(String(score), 28, 84);
    ctx.fillStyle = '#9db7c4'; ctx.font = '15px "Malgun Gothic",system-ui,sans-serif';
    ctx.fillText('연속 ' + streak, 112, 58);
    ctx.fillText('최고 ' + best, 112, 84);

    const age = (now - msg.t0) / 1000;
    if (age < 0.9) {
      ctx.globalAlpha = 1 - age / 0.9;
      ctx.textAlign = 'center';
      ctx.fillStyle = msg.color;
      ctx.font = '800 46px "Malgun Gothic",system-ui,sans-serif';
      ctx.fillText(msg.text, W / 2, 210 - age * 24);
      ctx.globalAlpha = 1;
    }
  }

  function draw(now) {
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    drawCourt(); drawZones(now); drawBall(now); drawRackets(now); drawEffects(now);
    if (showPrev.checked) drawPreview();
    drawHUD(now);
  }

  /* ---------- 루프 ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (now - lastSample > 33) { sample(); lastSample = now; checkMotion(now); }
    update(dt, now); draw(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
